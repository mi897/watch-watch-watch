[project]
name = "watch-companion"
version = "0.0.1"
description = "Companion service for watch-watch-watch"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = ["httpx>=0.27", "pydantic>=2.7", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[project.scripts]
watch-companion = "companion.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a running Jellyfin (set JELLYFIN_TEST_URL)"]
addopts = "-m 'not integration'"
