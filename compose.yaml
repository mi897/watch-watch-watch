# Core stack: Jellyfin + one-shot bootstrap. Copy .env.example to .env first.
name: watch-watch-watch

services:
  jellyfin:
    image: jellyfin/jellyfin:12.4.20261026-211555@sha256:fea863d0cd9ec445985d9c75fc6ed64e38a1d2766cf0c250a33d553f4fc1b771
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${JELLYFIN_PORT:-8096}:8096"   # loopback only; see docs for LAN access
    volumes:
      - ./data/jellyfin/config:/config
      - ./data/jellyfin/cache:/cache
      - ${MEDIA_DIR:?set MEDIA_DIR in .env}:/media:ro
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8096/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Run with: docker compose run --rm bootstrap   (safe to re-run)
  bootstrap:
    build: ./companion
    profiles: ["tools"]
    user: "${PUID:-1000}:${PGID:-1000}"
    depends_on:
      jellyfin: { condition: service_healthy }
    env_file: .env
    environment:
      JELLYFIN_URL: http://jellyfin:8096
      COMPANION_CONFIG: /config/config.yml
      COMPANION_DATA_DIR: /data
    volumes:
      - ./config.yml:/config/config.yml:ro
      - ./data/companion:/data
      - ${MEDIA_DIR:?set MEDIA_DIR in .env}:/media:ro
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    command: ["bootstrap"]
